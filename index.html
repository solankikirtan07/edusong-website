<!doctype html>
<html>
  <head>
    <title>EduSong</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f0f4ff;
        padding: 50px;
      }
      h1 {
        color: #6a0dad;
        font-size: 40px;
      }
      p {
        color: #333;
        font-size: 18px;
      }
      textarea {
        width: 400px;
        height: 120px;
        padding: 10px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-top: 20px;
      }
      button {
        background-color: #6a0dad;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        display: block;
        margin: 20px auto;
      }
      button:hover {
        background-color: #4b0082;
      }
      #inputSection {
        display: none;
      }
      #loadingText {
        display: none;
        color: #6a0dad;
      }
      audio {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to EduSong</h1>
    <p>Apne answers ko songs mein badlo aur asaani se yaad rakho!</p>
    <button onclick="showInput()">Start Now</button>

    <div id="inputSection">
      <p>Apna answer yaha likho:</p>
      <textarea
        id="answerText"
        placeholder="Jaise: Photosynthesis is the process..."
      ></textarea>
      <br />
      <button onclick="generateSong()">Generate Song</button>
      <p id="loadingText">Song ban raha hai, thoda wait karo...</p>
      <audio id="audioPlayer" controls style="display: none"></audio>
    </div>

    <script>
      function showInput() {
        document.getElementById("inputSection").style.display = "block";
      }

      function generateSong() {
        var text = document.getElementById("answerText").value;
        if (text.trim() === "") {
          alert("Pehle apna answer likho!");
          return;
        }

        document.getElementById("loadingText").style.display = "block";
        document.getElementById("audioPlayer").style.display = "none";

        fetch('https://edusong-website.onrender.com/generate', {, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text }),
        })
          .then((response) => response.blob())
          .then((blob) => {
            var url = URL.createObjectURL(blob);
            var player = document.getElementById("audioPlayer");
            player.src = url;
            player.style.display = "block";
            document.getElementById("loadingText").style.display = "none";
          })
          .catch((error) => {
            alert("Error aaya: " + error);
            document.getElementById("loadingText").style.display = "none";
          });
      }
    </script>
  </body>
</html>
